<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MobileClaw Trace</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --ink: #1b1f24; --muted: #5b6470; --line: #dde1e6;
    --accent: #2f6fde; --accent-soft: #e6eefc; --mono-bg: #f1f3f6;
    --ok: #1f8a4c; --warn: #b26a00; --bad: #c0362c; --calm: #6b7280;
    --chip-bg: #eef2ff; --chip-ink: #2c3e9e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b1; --line: #2a3038;
      --accent: #6ea0ff; --accent-soft: #1c2738; --mono-bg: #11151a;
      --ok: #4cc488; --warn: #e3a64a; --bad: #ff7a6e; --calm: #9aa4b1;
      --chip-bg: #232c47; --chip-ink: #c5d0ff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1216; --card: #171b21; --ink: #e8ebef; --muted: #9aa4b1; --line: #2a3038;
    --accent: #6ea0ff; --accent-soft: #1c2738; --mono-bg: #11151a;
    --ok: #4cc488; --warn: #e3a64a; --bad: #ff7a6e; --calm: #9aa4b1;
    --chip-bg: #232c47; --chip-ink: #c5d0ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px;
           padding: 12px 20px; background: var(--card); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 19px; margin: 0; font-weight: 650; }
  header .src { color: var(--muted); font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--calm); display: inline-block; }
  .dot.live { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 25%, transparent); }
  .dot.down { background: var(--bad); }
  header .status { color: var(--muted); font-size: 14px; }
  header .spacer { flex: 1; }
  button { font: inherit; font-size: 14px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  button:hover { border-color: var(--accent); }
  main { max-width: 1120px; margin: 0 auto; padding: 18px 16px 120px; display: flex; flex-direction: column; gap: 14px; }
  .empty { color: var(--muted); text-align: center; padding: 80px 0; font-size: 18px; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px; }
  .meta { display: flex; align-items: baseline; gap: 10px; color: var(--muted); font-size: 14px; }
  .meta .kind { text-transform: uppercase; letter-spacing: .06em; font-weight: 650; font-size: 12px; }
  .meta .time { font-variant-numeric: tabular-nums; margin-left: auto; }

  .triage { border-left: 5px solid var(--calm); padding: 10px 16px; }
  .triage .title { font-weight: 600; margin-top: 2px; overflow-wrap: anywhere; }
  .triage .body { color: var(--muted); font-size: 15px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .pill { display: inline-block; font-size: 13px; font-weight: 650; padding: 2px 10px; border-radius: 999px;
          background: var(--mono-bg); color: var(--ink); }
  .triage.reply, .triage.click_action { border-left-color: var(--accent); }
  .triage.escalate { border-left-color: var(--bad); }
  .triage.dismiss, .triage.do_nothing, .triage.snooze { border-left-color: var(--calm); }
  .triage .why { font-size: 14px; color: var(--muted); margin-top: 4px; }

  .turn { border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
  .turn h2 { margin: 2px 0 10px; font-size: 21px; font-weight: 650; }
  .turn .thinking { color: var(--accent); font-size: 15px; }
  details > summary { cursor: pointer; color: var(--muted); font-size: 14px; }
  .ctx pre { max-height: 320px; }
  pre { margin: 8px 0 0; padding: 10px 12px; background: var(--mono-bg); border-radius: 8px; overflow: auto;
        font: 13.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  ol.steps { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  ol.steps li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; }
  .num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 13px;
         font-weight: 700; background: var(--accent-soft); color: var(--accent); }
  .tool { font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .args { color: var(--muted); font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
  .result pre { max-height: 260px; }
  .pending { color: var(--muted); font-size: 14px; }
  .answer { margin-top: 14px; padding: 14px 16px; border-radius: 12px; background: var(--accent-soft); }
  .answer .label { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); font-weight: 700; }
  .answer .text { font-size: 19px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
  .answer .cost { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chip { padding: 7px 14px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-ink);
          font-weight: 600; font-size: 15px; }
  @media (max-width: 600px) {
    header { flex-wrap: wrap; padding: 10px 16px; }
    main { padding: 12px 16px 80px; }
    .answer .text { font-size: 17px; }
  }
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>MobileClaw · reasoning trace</h1>
  <span class="src" id="src"></span>
  <span class="status" id="status">connecting…</span>
  <span class="spacer"></span>
  <button id="clear" title="Hide everything so far — between visitors">Clear</button>
  <button id="theme" title="Light / dark">◐</button>
</header>
<main id="feed"><div class="empty" id="empty">Waiting for the phone… fire a notification or ask the assistant something.</div></main>
<script>
(() => {
  const feed = document.getElementById('feed');
  const empty = document.getElementById('empty');
  const nodes = new Map();      // event id -> element
  const hidden = new Set();     // ids cleared away
  let theme = null;

  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;
    return e;
  };

  // **bold** is the only markdown the model leans on in a suggestion; render just that.
  const richText = (target, text) => {
    text.split(/(\*\*[^*]+\*\*)/g).forEach(part => {
      if (part.startsWith('**') && part.endsWith('**') && part.length > 4) target.append(el('strong', null, part.slice(2, -2)));
      else if (part) target.append(document.createTextNode(part));
    });
  };

  const prettyArgs = raw => {
    try {
      const o = JSON.parse(raw);
      return Object.entries(o).map(([k, v]) => `${k}: ${typeof v === 'string' ? v : JSON.stringify(v)}`).join('   ·   ');
    } catch { return raw; }
  };

  function renderTriage(e) {
    const action = (e.decision.split('·')[0] || '').trim();
    const c = el('div', `card triage ${action}`);
    const m = el('div', 'meta');
    m.append(el('span', 'kind', `Notification · ${e.app}`), el('span', 'pill', e.decision || '…'), el('span', 'time', e.time));
    c.append(m, el('div', 'title', e.title));
    if (e.body) c.append(el('div', 'body', e.body));
    if (e.reasoning) {
      const d = el('details'); d.append(el('summary', null, 'why'), el('div', 'why', e.reasoning));
      c.append(d);
    }
    return c;
  }

  function renderTurn(e) {
    const c = el('div', 'card turn');
    const m = el('div', 'meta');
    m.append(el('span', 'kind', e.n != null ? `Agent turn #${e.n}` : 'Agent turn'), el('span', 'time', e.time));
    c.append(m, el('h2', null, e.title));

    if (e.prompt || e.history) {
      const d = el('details', 'ctx');
      d.append(el('summary', null, `What the model was given — ${e.prompt_head || ''}${e.history_head ? ' · ' + e.history_head : ''}`));
      if (e.prompt) d.append(el('pre', null, e.prompt));
      if (e.history) d.append(el('pre', null, e.history));
      c.append(d);
    }

    if (e.steps.length) {
      const ol = el('ol', 'steps');
      e.steps.forEach((s, i) => {
        const li = el('li');
        const right = el('div');
        right.append(el('div', 'tool', s.tool), el('div', 'args', prettyArgs(s.args)));
        if (s.result === null) right.append(el('div', 'pending', 'running…'));
        else {
          // Open by default: what each tool handed back is the part a visitor is here to see.
          const d = el('details', 'result');
          d.open = true;
          const gist = s.result.split('\n').map(x => x.trim()).filter(Boolean).join(' · ');
          d.append(el('summary', null, gist ? (gist.length > 110 ? gist.slice(0, 110) + '…' : gist) : '(empty result)'),
                   el('pre', null, s.result));
          right.append(d);
        }
        li.append(el('div', 'num', String(i + 1)), right);
        ol.append(li);
      });
      c.append(ol);
    }

    if (e.done) {
      const a = el('div', 'answer');
      a.append(el('div', 'label', 'Suggestion'));
      const t = el('div', 'text'); richText(t, e.answer || '(no text — tool calls only)'); a.append(t);
      if (e.actions && e.actions.length) {
        const chips = el('div', 'chips');
        e.actions.forEach(x => chips.append(el('span', 'chip', x)));
        a.append(chips);
      }
      const cost = (e.answer_head || '').replace(/^\(|\)$/g, '');
      if (cost) a.append(el('div', 'cost', cost));
      c.append(a);
    } else {
      c.append(el('div', 'thinking', e.steps.length ? 'thinking…' : 'asking the model…'));
    }
    return c;
  }

  function upsert(e) {
    if (hidden.has(e.id)) return;
    const nearBottom = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
    const node = e.type === 'triage' ? renderTriage(e) : renderTurn(e);
    const old = nodes.get(e.id);
    if (old) old.replaceWith(node); else feed.append(node);
    nodes.set(e.id, node);
    empty.style.display = 'none';
    if (nearBottom) window.scrollTo({ top: document.body.scrollHeight });
  }

  function setStatus(status, source) {
    document.getElementById('status').textContent = status;
    document.getElementById('src').textContent = source || '';
    document.getElementById('dot').className = 'dot ' + (status === 'live' ? 'live' : /lost|waiting|error/.test(status) ? 'down' : '');
  }

  document.getElementById('clear').onclick = () => {
    nodes.forEach((n, id) => { hidden.add(id); n.remove(); });
    nodes.clear();
    empty.style.display = '';
  };
  document.getElementById('theme').onclick = () => {
    const dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    theme = dark ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
  };

  const es = new EventSource('/events');
  es.onmessage = ev => {
    const msg = JSON.parse(ev.data);
    if (msg.kind === 'status') setStatus(msg.status, msg.source);
    else if (msg.kind === 'event') upsert(msg.event);
  };
  es.onerror = () => setStatus('viewer disconnected — is trace_viewer.py running?', '');
})();
</script>
</body>
</html>
